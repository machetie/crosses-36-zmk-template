# Applied to every build that uses the crosses keymap: both halves AND the dongle.
# Keep only settings that are valid for all three here; this file is merged
# after the shield .conf files, so anything set here overrides them.
# Halves-only settings: boards/shields/crosses/crosses_halves.conf
# Dongle-only settings: boards/shields/crosses_dongle/crosses_dongle.conf

CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

CONFIG_ZMK_POINTING=y
